<style id="hz-css">/* 固定淺色主題（不隨系統深色模式切換）。Layout: periodic-table "H₂" tile identity over a graph-paper hero with rising hydrogen bubbles; cobalt ink + one flame cyan. Sticky nav, hash views. */
:root{
  --bg:#f3f6f8; --surface:#ffffff; --sunk:#e8eef3; --ink:#0d1b2a; --muted:#566576; --line:#d5dee6; --line-strong:#b6c4d1;
  --accent:#0f5bd8; --accent-ink:#ffffff; --flame:#1e9be8; --warn:#b26a00; --ok:#1e7f4f; --bad:#b4372f;
  --c-keynote:#1747c4; --c-forum:#7a4bc0; --c-paper:#139fc4; --c-break:#8a96a3; --c-social:#b26a00; --c-ceremony:#1e7f4f;
  --serif:"Poppins","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"Poppins","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --r:10px; --todo-bg:#ffe27a; --todo-ink:#3d2c00;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.8}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--flame);outline-offset:2px;border-radius:4px}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--serif);text-wrap:balance;line-height:1.3;margin:0}
h2{font-size:1.75rem} h3{font-size:1.15rem}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--flame)}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;min-height:62px;position:relative}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex-shrink:0}
.mini-tile{width:38px;height:38px;border:1.5px solid var(--ink);border-radius:4px;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:1.2rem;position:relative;transition:transform .3s}
.brand:hover .mini-tile{transform:rotate(-6deg)}
.mini-tile small{position:absolute;top:1px;left:3px;font-family:var(--mono);font-size:.5rem;font-weight:500}
.brand b{font-family:var(--mono);font-weight:500;letter-spacing:.04em}
nav.main{display:flex;gap:1px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
nav.main a{padding:7px 10px;border-radius:6px;text-decoration:none;color:var(--muted);font-size:.9rem;white-space:nowrap;position:relative}
nav.main a:hover{color:var(--ink);background:var(--sunk)}
nav.main a[aria-current="page"]{color:var(--accent);font-weight:700}
nav.main a[aria-current="page"]::after{content:"";position:absolute;left:10px;right:10px;bottom:2px;height:2px;background:var(--accent);border-radius:2px}
.lang{border:1px solid var(--line);background:none;color:var(--ink);border-radius:6px;padding:6px 10px;font-family:var(--mono);font-size:.8rem;cursor:pointer}
.menu-btn{display:none;margin-left:auto;border:1px solid var(--line);background:none;color:var(--ink);border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}
.dd{position:relative}
.dd-btn{border:0;background:none;font:inherit;font-size:.9rem;color:var(--muted);padding:7px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;line-height:inherit}
.dd-btn:hover{color:var(--ink);background:var(--sunk)}
.dd.active > .dd-btn{color:var(--accent);font-weight:700}
.dd-btn .car{display:inline-block;font-size:.7em;margin-left:3px;transition:transform .2s}
.dd.open .dd-btn .car{transform:rotate(180deg)}
.dd-menu{position:absolute;top:100%;left:0;min-width:180px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 34px -14px rgba(13,27,42,.3);padding:6px;display:none;flex-direction:column;z-index:60}
.dd.open .dd-menu{display:flex}
@media (hover:hover) and (min-width:901px){.dd:hover .dd-menu,.dd:focus-within .dd-menu{display:flex}}
nav.main .dd-menu a{padding:9px 12px}
nav.main .dd-menu a[aria-current="page"]{background:var(--sunk)}
nav.main .dd-menu a[aria-current="page"]::after{display:none}
@media (max-width:900px){
  .menu-btn{display:block}
  .dd-btn{display:block;width:100%;text-align:left;padding:14px 12px 4px;font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;color:var(--muted);pointer-events:none}
  .dd-btn .car{display:none}
  .dd-menu{display:flex;position:static;box-shadow:none;border:0;padding:0 0 0 10px;min-width:0;background:none}
  nav.main{display:none;position:absolute;left:calc(-1*max(16px,env(safe-area-inset-left,0px)));right:calc(-1*max(16px,env(safe-area-inset-right,0px)));top:100%;background:var(--surface);border-bottom:1px solid var(--line);flex-direction:column;padding:8px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
  nav.main.open{display:flex}
  nav.main a{padding:11px 12px}
  nav.main a[aria-current="page"]::after{display:none}
}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:
  linear-gradient(var(--bg),transparent 35%),
  repeating-linear-gradient(0deg,transparent 0 31px,var(--line) 31px 32px),
  repeating-linear-gradient(90deg,transparent 0 31px,var(--line) 31px 32px);background-color:var(--bg)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero-in{position:relative;display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,24vw,360px);gap:64px;align-items:center;padding-block:56px 44px}
.hero h1{font-size:clamp(1.8rem,4.2vw,3.5rem);font-weight:900}
.hero .sub{font-size:1.1rem;color:var(--muted);margin-top:10px}
.hero .en{font-family:var(--mono);font-size:.85rem;color:var(--muted);margin-top:14px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;margin-top:24px}
.facts dt{font-family:var(--mono);font-size:.78rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;padding-top:3px}
.facts dd{margin:0;min-width:0}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:8px;text-decoration:none;font-weight:700;font-size:.95rem;border:1.5px solid var(--accent);color:var(--accent);background:var(--surface);cursor:pointer;font-family:inherit;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 25%,transparent)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.small{padding:6px 12px;font-size:.85rem}
.btn[aria-disabled="true"],.btn:disabled{border-color:var(--line);color:var(--muted);background:var(--sunk);cursor:not-allowed;font-weight:500;transform:none;box-shadow:none}
.tile{aspect-ratio:1;max-width:100%;border:2.5px solid var(--ink);border-radius:8px;background:var(--surface);padding:20px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:10px 10px 0 var(--sunk);transition:transform .4s}
.tile-wrap{perspective:1000px}
.tile{transform-style:preserve-3d;will-change:transform;transition:transform .25s ease-out}
.tile .cdline{font-family:var(--mono);font-size:.82rem;color:var(--accent);letter-spacing:.04em;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.9rem}
.tile .sym{font-family:var(--serif);font-weight:900;font-size:clamp(7.5rem,7vw,9rem);line-height:1}
.tile .sym sub{font-size:2.6rem;color:var(--flame)}
.tile .nm{font-family:var(--mono);font-size:.8rem;color:var(--muted);letter-spacing:.06em}
@media (max-width:820px){.hero-in{grid-template-columns:1fr;gap:28px;padding-block:32px}.tile{width:220px}.tile .sym{font-size:5rem}}
.ticker{position:relative;border-top:1px solid var(--line);background:var(--surface);display:flex;align-items:center;overflow:hidden}
.ticker b{flex-shrink:0;font-size:.8rem;padding:8px 14px;background:var(--accent);color:var(--accent-ink);font-weight:700;z-index:1}
.ticker-view{overflow:hidden;flex:1;min-width:0}
.ticker-track{display:flex;width:max-content;gap:56px;padding:8px 28px;animation:tick 38s linear infinite;font-size:.9rem}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker-track a{color:var(--ink);text-decoration:none;white-space:nowrap}
.ticker-track a:hover{color:var(--accent)}
@keyframes tick{to{transform:translateX(-50%)}}

/* sections */
main{padding-block:40px 64px}
.view{display:grid;gap:64px;animation:viewIn .45s cubic-bezier(.2,.7,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.head{display:grid;gap:6px}
.head p{color:var(--muted);max-width:70ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;min-width:0}
a.card{text-decoration:none;color:var(--ink);transition:border-color .2s,transform .2s;display:grid;gap:6px;align-content:start}
a.card:hover{border-color:var(--accent);transform:translateY(-2px)}
a.card .go{color:var(--accent);font-size:.88rem;margin-top:6px}
.card h3{margin-bottom:8px}
.prose{max-width:72ch;display:grid;gap:12px}
.prose ul{margin:0;padding-left:1.2em}
.note{font-size:.85rem;color:var(--muted)}
.tag{display:inline-block;font-family:var(--mono);font-size:.7rem;padding:1px 8px;border-radius:99px;border:1px solid currentColor;letter-spacing:.04em;vertical-align:2px;white-space:nowrap}
.tag.tbd{color:var(--warn)} .tag.now{color:var(--ok)} .tag.past{color:var(--muted)} .tag.bad{color:var(--bad)}
.ph{border:1.5px dashed var(--muted);border-radius:var(--r);background:repeating-linear-gradient(45deg,transparent 0 10px,var(--sunk) 10px 20px);display:grid;place-items:center;text-align:center;color:var(--muted);font-size:.85rem;padding:14px;min-height:120px;max-width:100%}
.ph b{display:block;color:var(--ink);font-weight:500}
.rv.in{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{transform:translateY(14px)}to{transform:none}}

/* countdown + timeline */
.status{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:18px}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.cd div{background:var(--sunk);border-radius:8px;padding:10px 4px;text-align:center}
.cd b{display:block;font-family:var(--mono);font-size:1.8rem;font-weight:500;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
.cd span{font-size:.72rem;color:var(--muted)}
.tl{list-style:none;margin:0;padding:0;display:grid;border-left:2px solid var(--line);margin-left:6px}
.tl li{position:relative;padding:0 0 20px 24px;display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:4px 18px}
.tl li::before{content:"";position:absolute;left:-7px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl li.past::before{border-color:var(--line);background:var(--line)}
.tl li.now::before{background:var(--ok);border-color:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
.tl li.past .tl-d,.tl li.past .tl-l{color:var(--muted)}
.tl-d{font-family:var(--mono);font-size:.88rem;font-variant-numeric:tabular-nums}
.tl-d s{color:var(--muted)}
@media (max-width:560px){.tl li{grid-template-columns:1fr}}

/* news */
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:4px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.newslist{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.htl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));position:relative}
.htl::before{content:"";position:absolute;left:0;right:0;top:6px;height:2px;background:var(--line)}
.htl li{position:relative;padding:30px 14px 0 0;display:grid;gap:6px;align-content:start;min-width:0}
.htl li::before{content:"";position:absolute;left:0;top:0;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2.5px solid var(--accent);box-sizing:border-box}
.htl li.past::before{border-color:var(--line-strong);background:var(--line)}
.htl li.now::before{background:var(--ok);border-color:var(--ok);box-shadow:0 0 0 5px color-mix(in srgb,var(--ok) 22%,transparent)}
.htl .d{font-family:var(--mono);font-size:.9rem;font-variant-numeric:tabular-nums}
.htl .d s{color:var(--muted)}
.htl .l{font-weight:700;line-height:1.45}
.htl li.past .d,.htl li.past .l{color:var(--muted)}
@media (max-width:900px){
  .htl{grid-template-columns:1fr}
  .htl::before{left:6px;right:auto;top:0;bottom:0;width:2px;height:auto}
  .htl li{padding:0 0 22px 30px}
}
.section{display:grid;gap:22px}
.news-item{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;background:var(--surface);display:grid;gap:4px}
.news-item .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.news-item h3{font-family:var(--sans);font-size:1rem}
.pin{color:var(--warn);font-weight:700}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;font:inherit;color:var(--muted);padding:10px 14px;cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.panel{padding-top:24px;display:grid;gap:22px}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.93rem}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;background:var(--sunk);font-size:.85rem}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.cur{background:color-mix(in srgb,var(--accent) 9%,transparent);font-weight:700}
.star{border:0;background:none;cursor:pointer;font-size:1.05rem;color:var(--muted);padding:0 4px;line-height:1}
.star[aria-pressed="true"]{color:var(--warn)}

/* agenda */
.ag{display:grid;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.ag-row{display:grid;grid-template-columns:130px 6px minmax(0,1fr);gap:16px;padding:14px 18px;border-bottom:1px solid var(--line)}
.ag-row:last-child{border-bottom:0}
.ag-row.live{background:color-mix(in srgb,var(--ok) 10%,transparent)}
.ag-bar{border-radius:3px}
.ag-row .t{font-family:var(--mono);font-size:.88rem;color:var(--muted)}
.ag-row .k{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
@media (max-width:560px){.ag-row{grid-template-columns:6px minmax(0,1fr)}.ag-row .t{grid-column:2}.ag-bar{grid-row:1/span 2}}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar input[type=search]{flex:1 1 240px;min-width:0}

/* topics */
.topic{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.code{font-family:var(--mono);font-weight:500;font-size:1.05rem;color:var(--accent);border:1.5px solid var(--accent);border-radius:6px;height:44px;display:grid;place-items:center}

/* people, logos, sponsors */
.person{display:grid;grid-template-columns:110px minmax(0,1fr);gap:18px;align-items:start}
.person .ph{min-height:110px;aspect-ratio:1;padding:6px;font-size:.72rem}
details{border-top:1px solid var(--line);padding-top:10px;margin-top:12px}
details summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:.9rem;list-style:none}
details summary::before{content:"＋ ";font-family:var(--mono)}
details[open] summary::before{content:"－ "}
details > div{padding-top:10px;display:grid;gap:10px;font-size:.93rem}
.logos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.logos .ph{min-height:84px;font-size:.78rem}
.org-group{display:grid;gap:10px}
.org-group h3{font-size:.95rem;font-family:var(--sans);color:var(--muted);font-weight:500}
.marquee{overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marquee-track{display:flex;gap:18px;width:max-content;animation:tick 45s linear infinite}
.marquee:hover .marquee-track{animation-play-state:paused}
.marquee img{height:72px;width:auto;border:1px solid var(--line);border-radius:8px;background:#fff;display:block}
.faq-cat{display:grid;gap:4px}
.faq details{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 18px;margin:0}
.faq details summary{color:var(--ink)}
.faq details summary::before{color:var(--accent)}
.faq .list{display:grid;gap:10px}

/* forms */
.form{display:grid;gap:16px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}
.field{display:grid;gap:6px;min-width:0;align-content:start}
.field > label,.field > .lbl{font-weight:700;font-size:.9rem}
.req::after{content:" *";color:var(--bad)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%;min-width:0}
textarea{min-height:120px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--accent)}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent);border-color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:8px}
.seg label{border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:flex-start;font-size:.9rem;background:var(--surface)}
.seg label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.hint{font-size:.8rem;color:var(--muted)}
.counter.over{color:var(--bad);font-weight:700}
.msg{border-radius:var(--r);padding:14px 18px;border:1.5px solid}
.msg.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--surface))}
.msg.err{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.feebox{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;background:var(--sunk);border-radius:8px;padding:12px 16px}
.feebox b{font-family:var(--mono);font-size:1.6rem;color:var(--accent);font-weight:500}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700;background:var(--sunk);color:var(--muted)}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stats b{display:block;font-family:var(--mono);font-size:1.6rem;font-weight:500}
table.staff{min-width:980px;font-size:.86rem}
table.staff select,table.staff input{padding:5px 8px;font-size:.85rem}
tr.dirty td{background:color-mix(in srgb,var(--warn) 9%,transparent)}

.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px;counter-reset:s}
.steps li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.steps li::before{content:counter(s);font-family:var(--mono);color:var(--accent);font-size:1.4rem;display:block}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 14px;align-items:center}
.kv dt{color:var(--muted);font-size:.88rem}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.copy{border:1px solid var(--line);background:none;color:var(--muted);border-radius:6px;font:inherit;font-size:.78rem;padding:3px 9px;cursor:pointer}
.banner{border:1.5px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--surface));border-radius:var(--r);padding:14px 18px}
.banner.info{border-color:var(--flame);background:color-mix(in srgb,var(--flame) 9%,var(--surface))}
.dl{display:flex;flex-wrap:wrap;gap:10px}
.floor{display:grid;grid-template-columns:64px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.floor + .floor{margin-top:-1px}
.floor b{display:grid;place-items:center;font-family:var(--mono);font-size:1.3rem;background:var(--sunk);border-right:1px solid var(--line)}
.floor div{padding:14px 18px}
.rooms{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.rooms span{font-family:var(--mono);font-size:.78rem;border:1px solid var(--line);border-radius:6px;padding:2px 8px}

footer{border-top:1px solid var(--line);background:var(--surface);padding-block:32px;font-size:.88rem;color:var(--muted)}
footer .wrap{display:grid;gap:12px}
footer a{color:var(--muted)}
.foot-org{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.foot-org b{display:block;font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;color:var(--muted);font-weight:500}
.foot-org span{color:var(--ink)}
.mapbox{position:relative;aspect-ratio:16/9;max-width:100%;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--sunk);display:grid;place-items:center;text-align:center;padding:16px}
.mapbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@media (max-width:600px){.mapbox{aspect-ratio:4/3}}
header .bar{transition:min-height .25s}
header.scrolled .bar{min-height:50px}
header.scrolled{box-shadow:0 8px 24px -16px rgba(13,27,42,.4)}
.progress{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:linear-gradient(90deg,var(--accent),var(--flame))}
.wordmark{font-family:var(--serif);font-weight:900;font-size:clamp(3.4rem,14vw,13rem);line-height:.9;letter-spacing:-.01em;color:var(--surface);-webkit-text-stroke:3px var(--line-strong);paint-order:stroke fill;white-space:nowrap;overflow:hidden;margin-top:18px;user-select:none}
.wordmark span{font-family:var(--mono);font-weight:500;color:var(--accent);-webkit-text-stroke:0;margin-left:.18em;font-size:.55em;vertical-align:.12em}

/* search & AI */
.search-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:8px;padding:6px 10px;font:inherit;font-size:.85rem;cursor:pointer;margin-left:6px}
.search-btn:hover{border-color:var(--accent);color:var(--ink)}
.search-btn svg{width:16px;height:16px;flex-shrink:0}
.search-btn kbd{font-family:var(--mono);font-size:.7rem;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--surface)}
@media (max-width:900px){.search-btn .lbl,.search-btn kbd{display:none}.search-btn{margin-left:auto}.menu-btn{margin-left:0}}
.sx{position:fixed;inset:0;z-index:100;background:rgba(13,27,42,.42);backdrop-filter:blur(3px);display:flex;justify-content:center;align-items:flex-start;padding:calc(8vh + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.sx-panel{width:100%;max-width:720px;max-height:80vh;display:flex;flex-direction:column;background:var(--surface);border-radius:14px;box-shadow:0 30px 80px -20px rgba(13,27,42,.5);overflow:hidden;animation:viewIn .25s ease-out}
.sx-top{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sx-top svg{width:20px;height:20px;color:var(--muted);flex-shrink:0}
.sx-top input{border:0;background:none;font-size:1.05rem;padding:6px 0;outline:none}
.sx-top input:focus{outline:none}
.sx-close{border:1px solid var(--line);background:none;border-radius:6px;font-family:var(--mono);font-size:.72rem;color:var(--muted);padding:3px 8px;cursor:pointer}
.sx-body{overflow:auto;padding:8px}
.sx-hint{padding:14px 12px;color:var(--muted);font-size:.9rem;display:grid;gap:10px}
.sx-hint .chips{display:flex;flex-wrap:wrap;gap:6px}
.sx-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start;width:100%;text-align:left;border:0;background:none;font:inherit;color:inherit;padding:10px 12px;border-radius:10px;cursor:pointer}
.sx-item[aria-selected="true"],.sx-item:hover{background:var(--sunk)}
.sx-item .k{grid-row:span 2;font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;color:var(--flame);border:1px solid currentColor;border-radius:99px;padding:1px 8px;margin-top:3px;white-space:nowrap}
.sx-item .t{font-weight:700;line-height:1.4}
.sx-item .x{font-size:.84rem;color:var(--muted);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sx-sec{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;color:var(--muted);padding:10px 12px 4px}
mark.todo{background:var(--todo-bg);color:var(--todo-ink);padding:0 4px;border-radius:3px;font-weight:700}
.todo-pill{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--todo-bg);color:var(--todo-ink);border-radius:99px;padding:6px 14px;font-size:.82rem;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.15)}
@media (prefers-reduced-motion:reduce){.ticker-track,.marquee-track{animation:none}.rv.in,.view{animation:none}.btn,.tile,a.card{transition:none}}

/* ===== 首頁主視覺（v22，依海報） ===== */
.kv-hero{display:block;border-bottom:0;background:linear-gradient(180deg,#ffffff 0%,#e9f5fc 18%,#cfe8f6 55%,#c2e4f6 100%)}
.kv-sky{position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 40% at 80% 10%,rgba(255,255,255,.85),transparent 70%),radial-gradient(40% 30% at 10% 30%,rgba(255,255,255,.6),transparent 70%)}
.kv-in{position:relative;z-index:1;padding-block:52px 0;font-family:"Poppins",var(--sans)}

/* ===== v28 封面動畫 ===== */
@keyframes kvIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes kvSide{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes kvFade{from{opacity:0}to{opacity:1}}
.kv-anim .kv-kick{animation:kvIn .7s cubic-bezier(.2,.7,.2,1) both}
.kv-anim .kv-pre{animation:kvIn .7s cubic-bezier(.2,.7,.2,1) .1s both}
.kv-anim .kv-title span{animation:kvIn .8s cubic-bezier(.2,.7,.2,1) .2s both}
.kv-anim .kv-title span+span{animation-delay:.34s}
.kv-anim .kv-zh{animation:kvIn .7s cubic-bezier(.2,.7,.2,1) .48s both}
.kv-anim .kv-tag{animation:kvIn .7s cubic-bezier(.2,.7,.2,1) .6s both}
.kv-anim .kv-main .cta{animation:kvIn .7s cubic-bezier(.2,.7,.2,1) .74s both}
.kv-anim .kv-side{animation:kvSide .9s cubic-bezier(.2,.7,.2,1) .45s both}
.kv-anim .kv-art{animation:kvFade 1.4s ease-out .3s both}
.kv-anim .kv-strip{animation:kvFade 1s ease-out 1s both}
.kv-side{perspective:1100px}
.kv-date{transition:transform .3s ease-out;transform-style:preserve-3d;will-change:transform}
.kv-art{overflow:hidden}
.kv-art>img{-webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.08) 10%,rgba(0,0,0,.3) 22%,rgba(0,0,0,.62) 36%,rgba(0,0,0,.88) 48%,#000 58%)!important;mask-image:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.08) 10%,rgba(0,0,0,.3) 22%,rgba(0,0,0,.62) 36%,rgba(0,0,0,.88) 48%,#000 58%)!important}
.kv-art>img{will-change:transform;transform:scale(1.08);transform-origin:center bottom}
.kv-hero canvas#bubbles{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}

.kv-sky .c1{width:420px;height:120px;top:9%;left:-30%;animation-duration:95s}

.kv-sky .c3{width:520px;height:140px;top:56%;left:-35%;animation-duration:140s;animation-delay:-90s;opacity:.7}
@keyframes kvCloud{to{transform:translateX(180vw)}}
.kv-hero{overflow:hidden}
@media (prefers-reduced-motion:reduce){
 .kv-anim *,.kv-sky .cl{animation:none!important}

}

<script id="hz-app">/* ============================ 程式（一般不需修改） ============================ */
const C = CONFIG;
const asset = p => (typeof ASSETS!=="undefined" && ASSETS[p]) || p;
C.mapsUrl = "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(C.mapQuery);
let lang = "zh";
const store = { get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}} };
lang = store.get("hefc-lang","zh");
const L = v => v==null ? "" : (typeof v==="object" && !Array.isArray(v)) ? (v[lang] ?? v.zh) : v;
const T = (zh,en) => lang==="en" ? en : zh;
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const todayD = ()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());};
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const D = s => {const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const WK=["日","一","二","三","四","五","六"],WKE=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fd(s,short){const d=D(s);return lang==="en"?`${WKE[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}${short?"":", "+d.getFullYear()}`:`${short?"":d.getFullYear()+"/"}${d.getMonth()+1}/${d.getDate()}（${WK[d.getDay()]}）`;}
const isD=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||"");
const showDate=d=>{const a=d.extendedTo||d.start;return !isD(a)||state(a,d.end)!=="past";};
const cmtBtn=(primary)=>C.cmt&&C.cmt.submitUrl?`<a class="btn${primary?" primary":""}" href="${esc(C.cmt.submitUrl)}" target="_blank" rel="noopener">${T("前往 CMT 投稿","Submit on CMT")}</a>`:`<span class="btn" aria-disabled="true">CMT submission link coming soon</span>`;
const sightsHtml=()=>`<section style="display:grid;gap:14px"><h3>${T("台南旅遊","Around Tainan")}</h3><div class="grid4">${C.sights.map(([z,e,d])=>`<div class="card" style="display:grid;gap:10px">${ph(T("景點照片","Photo"))}<h3>${T(z,e)}</h3><p class="note">${d}</p></div>`).join("")}</div></section>`;
const oname=x=>typeof x==="string"?x:L(x.name);

function startBubbles(){
  const cv=document.getElementById("bubbles"); if(!cv) return;
  const ctx=cv.getContext&&cv.getContext("2d"); if(!ctx) return; const dpr=Math.min(2,window.devicePixelRatio||1);
  const size=()=>{cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;};
  size(); window.addEventListener("resize",size);
  const col=()=>getComputedStyle(document.documentElement).getPropertyValue("--flame").trim()||"#139fc4";
  const W=()=>cv.width,H=()=>cv.height;
  const mk=(y)=>({x:Math.random()*W(),y:y??H()+20*dpr,r:(4+Math.random()*16)*dpr,v:(.25+Math.random()*.6)*dpr,ph:Math.random()*6.28,lab:Math.random()<.18});
  const bs=Array.from({length:16},()=>mk(Math.random()*H()));
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function frame(){
    if(!cv.isConnected) return;
    ctx.clearRect(0,0,W(),H()); const c=col();
    for(const b of bs){
      if(!reduce){b.y-=b.v;b.ph+=.015;b.x+=Math.sin(b.ph)*.35*dpr;}
      if(b.y<-30*dpr){Object.assign(b,mk());}
      const fade=Math.min(1,b.y/(H()*.5));
      ctx.globalAlpha=.32*fade; ctx.strokeStyle=c; ctx.lineWidth=1.3*dpr;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.283); ctx.stroke();
      if(b.lab&&b.r>10*dpr){ctx.globalAlpha=.45*fade;ctx.fillStyle=c;ctx.font=`600 ${Math.round(b.r*.75)}px "IBM Plex Mono",monospace`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("H₂",b.x,b.y);}
    }
    ctx.globalAlpha=1;
    if(!reduce) rafId=requestAnimationFrame(frame);
  }
  frame();
}
/* 首頁 H₂ 方塊：滑鼠移動時 3D 傾斜 */
function startTilt(){
  const hero=document.querySelector(".hero"), tile=document.getElementById("heroTile");
  if(!hero||!tile||matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  hero.onpointermove=e=>{if(e.pointerType!=="mouse")return;const t=tile.getBoundingClientRect(),cx=t.left+t.width/2,cy=t.top+t.height/2;
    const ry=Math.max(-8,Math.min(8,(e.clientX-cx)/innerWidth*26)), rx=Math.max(-7,Math.min(7,-(e.clientY-cy)/innerHeight*22));
    tile.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`;};
  hero.onpointerleave=()=>{tile.style.transform="";};
}
/* 首頁插畫：往下捲時視差移動 */
let pxRaf=0, pxOn=false;
function startParallax(){
  if(pxOn||matchMedia("(prefers-reduced-motion: reduce)").matches) return; pxOn=true;
  const upd=()=>{pxRaf=0;const im=document.querySelector(".kv-art>img");if(!im)return;const r=im.parentElement.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;
    const off=Math.min(r.height*0.16,Math.max(0,innerHeight-r.top)*0.12);im.style.transform=`translate3d(0,${off}px,0) scale(1.08)`;};
  addEventListener("scroll",()=>{if(!pxRaf)pxRaf=requestAnimationFrame(upd);},{passive:true}); upd();
}
function startCountdown(){
  const el=document.getElementById("cd"), tc=document.getElementById("tileCd"); if(!el&&!tc) return;
  const [h,m]=C.openTime.split(":").map(Number); const tgt=D(C.start); tgt.setHours(h,m,0,0);
  const p2=n=>String(n).padStart(2,"0");
  const tick=()=>{let s=Math.max(0,Math.floor((tgt-new Date())/1000));const v=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];
    if(el) el.querySelectorAll("b").forEach((b,i)=>b.textContent=String(v[i]).padStart(i?2:1,"0"));
    if(tc) tc.textContent=s>0?`T−${v[0]}${T(" 天 ","d ")}${p2(v[1])}:${p2(v[2])}:${p2(v[3])}`:"LIVE · NCKU";};
  tick(); timers.push(setInterval(tick,1000));
}

function agendaDay(day){
  const names={keynote:T("大會演講","Plenary"),forum:T("技術論壇","Forum"),paper:T("論文發表","Papers"),break:T("報到／休息","Break"),social:T("餐敘","Social"),ceremony:T("典禮","Ceremony")};
  const now=new Date(), isToday=iso(todayD())===day.day, hm=`${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
  return `<div class="legend">${Object.entries(names).map(([k,v])=>`<span><i style="background:var(--c-${k})"></i>${v}</span>`).join("")}</div>
  <div class="ag">${day.items.map(([a,b,k,t,w])=>`<div class="ag-row${isToday&&hm>=a&&hm<b?" live":""}" data-search="${esc((L(t)+" "+w).toLowerCase())}"><span class="t">${a}–${b}</span><span class="ag-bar" style="background:var(--c-${k})"></span><div><span class="k" style="color:var(--c-${k})">${names[k]}</span><div style="font-weight:700">${L(t)}</div>${w?`<div class="note">${w}</div>`:""}</div></div>`).join("")}</div>`;
}

function updateCalc(){
  const o=document.getElementById("fcOut"); if(!o) return;
  const cat=+document.getElementById("fcCat").value, w=document.getElementById("fcWhat").value, d=document.getElementById("fcDate").value||iso(todayD());
  const r=calcFee(cat,w!=="forum",w!=="conf",d);
  o.innerHTML=`<span class="note">${T("應繳","Total")}</span><b>${money(r.cur,r.amount)}</b><span class="note">${r.stage}${r.amount==null?"":"・"+T("依匯款日期","by payment date")}</span>`;
}

function statusPill(v){const m={"審核通過":"ok","已繳費":"ok","待確認":"warn","審核未通過":"bad","未繳費":"bad"};return v?`<span class="pill ${m[v]||""}">${v}</span>`:"";}
function readFile(f){return new Promise((res,rej)=>{if(f.size>20*1024*1024)return rej(new Error(T("檔案超過 20 MB","File exceeds 20 MB")));const r=new FileReader();r.onload=()=>res({name:f.name,mime:f.type||"application/octet-stream",data:String(r.result).split(",")[1]});r.onerror=()=>rej(new Error("read error"));r.readAsDataURL(f);});}
const showMsg=(id,ok,html)=>{const el=document.getElementById(id);if(el)el.innerHTML=`<div class="msg ${ok?"ok":"err"}">${html}</div>`;};

const IDX={general:0,student:1,intl:2,intlStudent:3};
function initSubmit(){
  const f=document.getElementById("subForm"); if(!f) return;
  const sync=()=>{
    const mode=f.elements.mode.value, paper=mode==="paper", idn=f.elements.identity.value, stu=idn==="student"||idn==="intlStudent", intl=idn==="intl"||idn==="intlStudent";
    f.elements.withForum.disabled=intl; if(intl) f.elements.withForum.checked=false;
    f.querySelectorAll("[data-paper]").forEach(e=>e.hidden=!paper);
    f.querySelectorAll("[data-nopaper]").forEach(e=>e.hidden=paper);
    f.querySelector("[data-student]").hidden=!stu;
    const conf=mode!=="forum", forum=mode==="forum"||mode==="both"||(paper&&f.elements.withForum.checked);
    const r=calcFee(IDX[idn]??0,conf,forum,iso(todayD()));
    document.getElementById("subFee").innerHTML=(intl&&forum)?`<span class="note">${T("國際身分報名技術論壇請來信洽詢大會 hanzt2027@gmail.com","International forum registration: please email hanzt2027@gmail.com")}</span>`:`<span class="note">${T("目前應繳","Fee if paid today")}</span><b>${money(r.cur,r.amount)}</b><span class="note">${r.stage}・${T("實際以付款日期為準","final amount follows payment date")}</span>`;
  };
  f.addEventListener("input",sync); f.addEventListener("change",sync); sync();
  f.addEventListener("submit",async e=>{
    e.preventDefault(); const btn=document.getElementById("subBtn");
    const mode=f.elements.mode.value, paper=mode==="paper";
    const p={action:"submit",mode,identity:f.elements.identity.value,consent:f.elements.consent.checked,author:f.elements.author.value.trim(),affiliation:f.elements.affiliation.value.trim(),email:f.elements.email.value.trim()};
    if(paper) Object.assign(p,{type:f.elements.type.value,field:f.elements.field.value,title:f.elements.title.value.trim(),withForum:f.elements.withForum.checked,cmtId:f.elements.cmtId.value.trim()});
    const miss=[];
    if(!p.author)miss.push(T("姓名","name"));if(!p.affiliation)miss.push(T("單位","affiliation"));if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(p.email))miss.push("Email");
    if(paper){if(!p.type)miss.push(T("發表形式","type"));if(!p.field)miss.push(T("領域","area"));if(!p.title)miss.push(T("題目","title"));if(!p.cmtId)miss.push(T("CMT 論文編號","CMT paper ID"));}
    const stuId=p.identity==="student"||p.identity==="intlStudent", intlId=p.identity==="intl"||p.identity==="intlStudent";
    if(stuId&&!f.elements.proof.files[0])miss.push(T("學生證明","student proof"));
    if(!p.consent)miss.push(T("個資同意","privacy consent"));
    if(intlId&&(mode==="forum"||mode==="both"||p.withForum)) return showMsg("subMsg",false,T("國際身分報名技術論壇請來信洽詢大會 hanzt2027@gmail.com","International forum registration: please email hanzt2027@gmail.com"));
    if(miss.length) return showMsg("subMsg",false,T("請補齊：","Please complete: ")+miss.join("、"));
    btn.disabled=true; btn.textContent=T("送出中…","Submitting…");
    try{
      if(stuId) p.proof=await readFile(f.elements.proof.files[0]);
      const r=await api(p); if(!r.ok) throw new Error(r.error);
      showMsg("subMsg",true,`<b>${T("送出成功","Submitted")}</b>　${T("編號","ID")} <span class="mono">${r.id}</span>・${T("應繳","Fee")} ${r.fee.currency||"NTD"} ${r.fee.amount.toLocaleString()}（${r.fee.stage}）<br>${T("請到「報名與繳費管理」登入後線上付款。","Sign in to Manage registration to pay online.")}<br><span class="note">${r.demoCode?T(`展示模式驗證碼：${r.demoCode}`,`Demo code: ${r.demoCode}`):T("確認信與驗證碼已寄到你的 Email，沒收到請檢查垃圾郵件匣。","Check your inbox (and spam) for the code.")}</span>`);
      f.reset(); sync();
    }catch(err){showMsg("subMsg",false,esc(err.message));}
    finally{btn.disabled=false;btn.textContent=T("確認送出","Submit");}
  });
}

let pubCfg=null;
async function getPublicConfig(){ if(pubCfg) return pubCfg; try{const r=await api({action:"publicConfig"}); pubCfg=r&&r.ok?r:{ecpay:{},paypal:{}};}catch(e){pubCfg={ecpay:{},paypal:{}};} return pubCfg; }
function alertMsg(err){const m=document.getElementById("ecpayMsg")||document.getElementById("ppMsg")||document.getElementById("payMsg"); if(m) m.innerHTML=`<div class="msg err">${esc(err.message||err)}</div>`;}
/* 綠界：先同步開新視窗（避免被瀏覽器擋），再把付款表單送到那個視窗 */
async function payEcpay(email,code){
  let w=null; try{w=window.open("","hanztpay");}catch(e){}
  try{ if(w&&w.document) w.document.write('<p style="font-family:sans-serif;padding:24px">正在前往綠界付款頁… Redirecting to ECPay…</p>'); }catch(e){}
  try{
    const r=await api({action:"ecpayCreate",email,code}); if(!r.ok) throw new Error(r.error);
    const form=document.createElement("form"); form.method="POST"; form.action=r.url; form.acceptCharset="UTF-8"; form.target=w?"hanztpay":"_top";
    Object.entries(r.params).forEach(([k,v])=>{const i=document.createElement("input");i.type="hidden";i.name=k;i.value=v;form.appendChild(i);});
    document.body.appendChild(form); form.submit(); form.remove();
    showMsg("ecpayMsg",true,T("已開啟綠界付款頁。付款完成後，回到這裡按「重新整理狀態」。","ECPay opened. After paying, come back and press Refresh status."));
  }catch(err){ try{w&&w.close();}catch(e){} showMsg("ecpayMsg",false,esc(err.message)); }
}
/* PayPal：從後端取得 Client ID 後載入 SDK；訂單由後端建立與確認 */
async function mountPayPal(email,code){
  const box=document.getElementById("ppBtns");
  try{
    const cfg=await getPublicConfig(); const cid=cfg.paypal&&cfg.paypal.clientId;
    if(!cid){box.innerHTML=`<p class="note">${T("PayPal 付款尚未開通，請來信 hanzt2027@gmail.com。","PayPal is not available yet. Please email hanzt2027@gmail.com.")}</p>`;return;}
    if(!window.paypal) await new Promise((res,rej)=>{const sc=document.createElement("script");sc.src=`https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(cid)}&currency=USD&intent=capture`;sc.onload=res;sc.onerror=()=>rej(new Error(T("PayPal 載入失敗","Could not load PayPal")));document.head.appendChild(sc);});
    box.innerHTML="";
    window.paypal.Buttons({
      createOrder:async()=>{const r=await api({action:"paypalCreate",email,code}); if(!r.ok) throw new Error(r.error); return r.orderID;},
      onApprove:async(d)=>{const r=await api({action:"paypalCapture",email,code,orderID:d.orderID}); if(!r.ok) throw new Error(r.error); renderManage(r.record,email,code);},
      onError:(err)=>showMsg("ppMsg",false,esc((err&&err.message)||T("PayPal 付款失敗，請稍後再試","PayPal payment failed")))
    }).render("#ppBtns");
  }catch(err){box.innerHTML="";showMsg("ppMsg",false,esc(err.message));}
}

const STOP=new Set(["怎麼","什麼","如何","多少","請問","是否","可以","需要","一下","我要","我想","要在","的是","在哪","哪裡","嗎","呢","the","a","an","is","to","of","and","for","in","do","i","what","how"]);
const nrm=x=>String(x??"").toLowerCase();
function sxTerms(q){
  q=nrm(q).trim(); const out=new Set();
  q.split(/[\s,，、。？?！!：:；;／/（）()「」"']+/).filter(Boolean).forEach(w=>{
    if(/[㐀-鿿]/.test(w)){ if(w.length<=2){if(!STOP.has(w))out.add(w);} else for(let i=0;i<w.length-1;i++){const b=w.slice(i,i+2); if(!STOP.has(b)) out.add(b);} }
    else if(!STOP.has(w)&&w.length>1) out.add(w);
  });
  SYN.forEach(([keys,add])=>{if(keys.some(k=>q.includes(k))) add.forEach(a=>out.add(nrm(a)));});
  return [...out];
}

function sxSearch(q){
  const ts=sxTerms(q); if(!ts.length) return [];
  return buildIndex().map(e=>{const t=nrm(e.t),x=nrm(e.x);let sc=0;ts.forEach(w=>{if(t.includes(w))sc+=3;else if(x.includes(w))sc+=1;});if(nrm(q).trim()&&t.includes(nrm(q).trim()))sc+=6;return {...e,sc};})
    .filter(e=>e.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,8);
}
const sx={open:false,q:"",sel:0,items:[]};
function sxOpen(prefill){const el=document.getElementById("sx");el.hidden=false;sx.open=true;const inp=document.getElementById("sxInput");inp.placeholder=T("搜尋網站內容…（例：學生早鳥、停車、晚宴）","Search the site…");inp.value=prefill??sx.q;sxRender();setTimeout(()=>inp.focus(),20);}
function sxClose(){document.getElementById("sx").hidden=true;sx.open=false;}
function sxRender(){
  const body=document.getElementById("sxBody"); const q=document.getElementById("sxInput").value; sx.q=q;
  const res=sxSearch(q);
  sx.items=res; if(sx.sel>=sx.items.length) sx.sel=0;
  let h="";
  if(!q.trim()){
    const ex=T(["投稿截止日","學生早鳥費用","怎麼到會場","晚宴地點","刷卡"],["deadline","student fee","how to get there","banquet","credit card"]);
    h+=`<div class="sx-hint"><span>${T("輸入關鍵字搜尋整個網站。","Type keywords to search the whole site.")}</span><div class="chips">${ex.map(x=>`<button class="chip" data-sxq="${esc(x)}">${esc(x)}</button>`).join("")}</div></div>`;
  } else if(res.length){
    h+=`<div class="sx-sec">${T("網站內容","ON THIS SITE")}</div>`+res.map((r,i)=>`<button class="sx-item" data-sxi="${i}" aria-selected="${sx.sel===i}"><span class="k">${L(VIEW_KIND[r.v]||r.v)}</span><span class="t">${esc(r.t)}</span><span class="x">${esc(r.x)}</span></button>`).join("");
  } else h+=`<div class="sx-hint">${T("找不到相關內容，換個關鍵字試試，或到 FAQ、聯絡我們。","No results. Try other words, or see FAQ / contact us.")}</div>`;
  body.innerHTML=h;
  body.querySelector('[aria-selected="true"]')?.scrollIntoView({block:"nearest"});
}
function sxPick(i){
  const it=sx.items[i]; if(!it) return;
  sxClose(); if(it.tab) tabState[it.tab[0]]=it.tab[1]; go(it.v);
  if(it.focus) setTimeout(()=>{const d=[...document.querySelectorAll(".faq details")].find(x=>x.querySelector("summary").textContent===it.focus); if(d){d.open=true;d.scrollIntoView({behavior:"smooth",block:"center"});}},60);
}
document.getElementById("searchBtn").onclick=()=>sxOpen();
document.getElementById("sxClose").onclick=sxClose;
document.getElementById("sx").addEventListener("click",e=>{
  if(e.target.id==="sx"){sxClose();return;}
  const b=e.target.closest("[data-sxi]"); if(b){sxPick(+b.dataset.sxi);return;}
  const c=e.target.closest("[data-sxq]"); if(c){const inp=document.getElementById("sxInput");inp.value=c.dataset.sxq;sx.sel=0;sxRender();inp.focus();}
});
document.getElementById("sxInput").addEventListener("input",()=>{sx.sel=0;sxRender();});
document.getElementById("sxInput").addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){e.preventDefault();sx.sel=Math.min(sx.items.length-1,sx.sel+1);sxRender();}
  else if(e.key==="ArrowUp"){e.preventDefault();sx.sel=Math.max(0,sx.sel-1);sxRender();}
  else if(e.key==="Enter"){e.preventDefault();sxPick(sx.sel);}
  else if(e.key==="Escape"){sxClose();}
});
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();sx.open?sxClose():sxOpen();}
  else if(e.key==="/"&&!sx.open&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName||"")){e.preventDefault();sxOpen();}
  else if(e.key==="Escape"&&sx.open) sxClose();
});

/* ---------- render ---------- */
const NAV=[
  ["home",{zh:"首頁",en:"Home"}],
  {group:{zh:"會議資訊",en:"About"}, items:[["info",{zh:"大會資訊",en:"Conference"}],["speakers",{zh:"大會講者",en:"Speakers"}],["venue",{zh:"交通住宿",en:"Travel & venue"}],["h2car",{zh:"氫能車競賽",en:"H₂ car contest"}]].filter(v=>v[0]!=="h2car"||C.showH2Car)},
  ["agenda",{zh:"議程",en:"Program"}],
  {group:{zh:"徵稿與報名",en:"Papers & registration"}, items:[["cfp",{zh:"徵稿資訊",en:"Call for papers"}],["register",{zh:"註冊費用",en:"Fees"}],["submit",{zh:"線上報名",en:"Register"}]]},
  ["faq",{zh:"FAQ",en:"FAQ"}],
  ["contact",{zh:"聯絡贊助",en:"Contact"}]
];
const validView=h=>!!(V[h]&&(h!=="h2car"||C.showH2Car));
let route=(()=>{let h="";try{h=location.hash.slice(1);}catch(e){}return validView(h)?h:"home";})();
function current(){return route;}
/* 頁面切換：不依賴網址 #，嵌在 Google Sites 或預覽視窗裡也能正常切換 */
function go(view){
  if(!validView(view)) view="home";
  route=view; render(); window.scrollTo(0,0);
  document.getElementById("nav").classList.remove("open");
  try{history.replaceState(null,"","#"+view);}catch(e){}
}
function render(){
  timers.forEach(clearInterval); timers=[]; cancelAnimationFrame(rafId);
  document.documentElement.lang=lang==="en"?"en":"zh-Hant";
  const cur=current();
  const navA=([k,n])=>`<a href="#${k}" ${k===cur?'aria-current="page"':""}>${L(n)}</a>`;
  document.getElementById("nav").innerHTML=NAV.map(x=>Array.isArray(x)?navA(x):`<div class="dd${x.items.some(i=>i[0]===cur)?" active":""}"><button type="button" class="dd-btn" aria-expanded="false">${L(x.group)}<span class="car" aria-hidden="true">▾</span></button><div class="dd-menu">${x.items.map(navA).join("")}</div></div>`).join("");
  document.getElementById("langBtn").textContent=lang==="en"?"中文":"EN";
  const sb=document.getElementById("searchBtn"); sb.querySelector(".lbl").textContent=T("搜尋","Search"); sb.setAttribute("aria-label",T("搜尋網站","Search the site"));
  document.getElementById("menuBtn").textContent=T("選單","Menu");
  document.getElementById("hero").innerHTML=cur==="home"?hero():"";
  document.getElementById("app").innerHTML=`<div class="view">${V[cur]()}</div>`;
  document.getElementById("foot").innerHTML=`${(()=>{const og=C.organizers,ls=[og[1],og[0],...og.slice(2)].filter(Boolean).flatMap(g=>g.items).filter(x=>x&&x.logo);return ls.length?`<div class="foot-logos">${ls.map(x=>{const im=`<img src="${asset(x.logo)}" alt="${esc(oname(x))}" class="${x.wordmark?"wm":""}">`;return x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener" title="${esc(oname(x))}">${im}</a>`:`<span title="${esc(oname(x))}">${im}</span>`;}).join("")}</div>`:"";})()}<div class="foot-org"><div><b>EVENT</b><span>${L(C.title)}</span>${lang==="zh"?`<br>${C.title.en}`:""}</div><div><b>ORGANIZER</b><span>${C.organizers[0].items.map(olink).join("、")}</span>${footEn(C.organizers[0])}</div><div><b>HOST</b><span>${C.organizers[1].items.map(olink).join("、")}</span>${footEn(C.organizers[1])}</div></div>
   <div>${T("往屆網站","Past editions")}：${C.pastSites.map(([y,u])=>`<a href="${u}" target="_blank" rel="noopener">${y}</a>`).join("　")}</div>`;
  document.getElementById("footEnd").innerHTML=`<div class="mono">© ${C.year} ${C.short}</div><div class="wordmark" aria-hidden="true">HANZT<span>${C.year}</span></div>`;
  if(cur==="home"){startBubbles();startTilt();startCountdown();startParallax();}
  if(cur==="register"){["fcCat","fcWhat","fcDate"].forEach(id=>document.getElementById(id).addEventListener("input",updateCalc));updateCalc();}
  if(cur==="submit"){initSubmit();initManage();}
  if(cur==="staff") renderStaff();
  if(cur==="agenda") initAgenda();
  if(cur==="faq") document.getElementById("faqSearch").addEventListener("input",e=>{const q=e.target.value.toLowerCase().trim();document.querySelectorAll(".faq details").forEach(d=>{const hit=!q||d.dataset.search.includes(q);d.hidden=!hit;if(q&&hit)d.open=true;});});
  const io=("IntersectionObserver" in window)?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{threshold:.1}):null;
  if(io) document.querySelectorAll(".rv").forEach(el=>io.observe(el));
  onScroll();
  markTodos();
  try{hideTodos();}catch(e){console.error(e);}
}
function onScroll(){const hd=document.querySelector("header"), pr=document.getElementById("progress"); if(!hd) return;
  const y=window.scrollY||0; hd.classList.toggle("scrolled",y>8);
  const max=document.documentElement.scrollHeight-innerHeight; if(pr) pr.style.width=(max>0?Math.min(100,y/max*100):0)+"%";}
window.addEventListener("scroll",onScroll,{passive:true});
function hideTodos(){
  const on=!!C.hideTodo; document.body.classList.toggle("hide-todo",on); if(!on) return;
  const rm=e=>{if(e&&e.parentNode)e.remove();};
  const meaningful=c=>{const k=c.cloneNode(true);k.querySelectorAll("h1,h2,h3,h4,.eyebrow,.tag,mark.todo,.copy,button").forEach(x=>x.remove());return k.textContent.replace(/[\s｜|・·:：,，、/／\-–]+/g,"").length>0;};
  const touched=new Set();
  ["hero","app","foot"].forEach(id=>{const root=document.getElementById(id);if(!root)return;
    root.querySelectorAll("mark.todo").forEach(m=>{
      if(!m.isConnected) return;
      const card=m.closest(".card,article,.person,[class^=grid]>div");
      let t;
      if((t=m.closest(".ticker-track>*"))) return rm(t);
      if((t=m.closest("article.news-item"))){ if(m.closest("h3,h4")) return rm(t); t=m.closest("p,div:not(.news-item)"); if(t&&t!==t.closest("article")) rm(t); else rm(m); return; }
      if((t=m.closest(".ph"))) return rm(t);
      if((t=m.closest("tr"))){touched.add(t.closest("table")); return rm(t);}
      if((t=m.closest("li"))){touched.add(t.parentElement); return rm(t);}
      if((t=m.closest("dd"))){const dt=t.previousElementSibling; if(dt&&dt.tagName==="DT")rm(dt); touched.add(t.parentElement); rm(t); if(card)touched.add(card); return;}
      if(card&&(m.closest("h3,h4")||m.parentElement===card)){touched.add(card.parentElement); return rm(card);}
      t=m.closest("p,div.note");
      if(t&&!t.className&&t.tagName==="P"&&t.textContent.replace(/\s/g,"").length>12){
        const tx=[...t.childNodes].map(n=>n.nodeType===3?n.nodeValue:(n.matches&&n.matches("mark.todo")?"\u0000":"\u0001")).join("");
        if(!tx.includes("\u0001")){const cjk=/[\u4e00-\u9fff]/.test(tx);
          t.textContent=(cjk?tx.replace(/[^：，。]*\u0000[^：，。]*，?/g,""):tx.replace(/[^.]*\u0000[^.]*\.\s*/g,"")).replace(/\u0000/g,""); return;}
      }
      if(t&&t!==card){rm(t); if(card)touched.add(card); return;}
      rm(m); if(card)touched.add(card);
    });
  });
  touched.forEach(c=>{ if(!c||!c.isConnected) return;
    if(c.matches(".card,article,.person,[class^=grid]>div")){ if(!meaningful(c)){const p=c.parentElement; rm(c); touched.add(p);} }
  });
  const tba=()=>{const d=document.createElement("p");d.className="note tba";d.textContent=T("將於近期公布。","To be announced.");return d;};
  document.querySelectorAll("#app table").forEach(tb=>{ if(!tb.querySelector("tbody tr")){const w=tb.closest(".tw")||tb; w.replaceWith(tba());}});
  document.querySelectorAll("#app dl,#app ul,#app ol,#app .newslist,#app [class^=grid],#app .ag-row>div").forEach(c=>{ if(c.isConnected&&!c.children.length&&!c.textContent.trim()) rm(c);});
  document.querySelectorAll("#app .card,#app .person").forEach(c=>{ if(!meaningful(c)&&!c.querySelector("img,input,select,textarea,a,canvas,svg,table")) rm(c);});
  document.querySelectorAll("#app [class^=grid]").forEach(g=>{ if(!g.children.length){ const h=g.previousElementSibling; if(h&&/^H[2-4]$/.test(h.tagName)) rm(h); rm(g);} });
  document.querySelectorAll("#app section").forEach(sc=>{ if(!sc.querySelector("p,li,td,dd,img,.card,form,a,input,canvas,svg:not(h2 svg)")&&!meaningful(sc)) rm(sc);});
  document.querySelectorAll("#app .panel").forEach(pn=>{ if(!pn.textContent.trim()&&!pn.querySelector('input,select,img,table,.card')){const b=document.querySelector(`#app button[data-tabs="${pn.dataset.panel}"][data-i="${pn.dataset.i}"]`); if(b) b.hidden=true; }});
}
function markTodos(){
  let n=0;
  ["hero","app","foot"].forEach(id=>{const root=document.getElementById(id);if(!root)return;
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:t=>t.nodeValue.includes("〔待填〕")&&!t.parentElement.closest("mark,script,style,textarea,option")?1:2});
    const list=[];while(w.nextNode())list.push(w.currentNode);
    list.forEach(t=>{const frag=document.createDocumentFragment();t.nodeValue.split("〔待填〕").forEach((part,i)=>{if(i){const m=document.createElement("mark");m.className="todo";m.textContent=T("待填","TODO");frag.appendChild(m);n++;}if(part)frag.appendChild(document.createTextNode(part));});t.replaceWith(frag);});
  });
  const pill=document.getElementById("todoPill");pill.hidden=!n;pill.textContent=T(`本頁還有 ${n} 處待填`,`${n} items to fill on this page`);
}
function initAgenda(){
  const s=document.getElementById("agSearch"), m=document.getElementById("mineOnly");
  const apply=()=>{const q=s.value.toLowerCase().trim(), only=m.getAttribute("aria-pressed")==="true", mine=store.get("hefc-mine",[]);
    document.querySelectorAll("#agWrap [data-search]").forEach(r=>{r.hidden=!((!q||r.dataset.search.includes(q))&&(!only||(r.dataset.paper&&mine.includes(r.dataset.paper))||(!r.dataset.paper&&!only)));});};
  s.addEventListener("input",apply); m.onclick=()=>{m.setAttribute("aria-pressed",m.getAttribute("aria-pressed")!=="true");apply();};

window.addEventListener("hashchange",()=>{let h="";try{h=location.hash.slice(1);}catch(e){} if(validView(h)&&h!==route) go(h);});
document.addEventListener("click",e=>{
  const ddb=e.target.closest(".dd-btn");
  document.querySelectorAll(".dd.open").forEach(d=>{if(!ddb||d!==ddb.parentElement){d.classList.remove("open");d.querySelector(".dd-btn").setAttribute("aria-expanded","false");}});
  if(ddb){const d=ddb.parentElement,o=d.classList.toggle("open");ddb.setAttribute("aria-expanded",o);return;}
  const t=e.target.closest("[data-tabs]");
  if(t){const id=t.dataset.tabs,i=+t.dataset.i;tabState[id]=i;const g=t.closest(".tabgroup");
    g.querySelectorAll(`:scope > .tabs [data-tabs="${id}"]`).forEach(b=>b.setAttribute("aria-selected",+b.dataset.i===i));
    g.querySelectorAll(`:scope > [data-panel="${id}"]`).forEach(p=>p.hidden=+p.dataset.i!==i);return;}
  const na=e.target.closest("[data-newsall]"); if(na){tabState.newsAll=!tabState.newsAll;render();document.getElementById("news")?.scrollIntoView();return;}
  const n=e.target.closest("[data-news]"); if(n){tabState.news=n.dataset.news;render();document.getElementById("news")?.scrollIntoView();return;}
  const j=e.target.closest("[data-jump]"); if(j){e.preventDefault();if(current()!=="home")go("home");setTimeout(()=>document.getElementById(j.dataset.jump)?.scrollIntoView({behavior:"smooth"}),50);return;}
  const a=e.target.closest('a[href^="#"]'); if(a){const h=a.getAttribute("href").slice(1); e.preventDefault(); if(validView(h)) go(h); else if(h) document.getElementById(h)?.scrollIntoView({behavior:"smooth"}); return;}
  const st=e.target.closest("[data-star]"); if(st){const id=st.dataset.star;let mine=store.get("hefc-mine",[]);mine=mine.includes(id)?mine.filter(x=>x!==id):[...mine,id];store.set("hefc-mine",mine);document.querySelectorAll(`[data-star="${id}"]`).forEach(b=>b.setAttribute("aria-pressed",mine.includes(id)));return;}
  const c=e.target.closest("[data-copy]"); if(c){const el=document.getElementById(c.dataset.copy);const done=()=>{c.textContent=T("已複製","Copied");setTimeout(()=>c.textContent=T("複製","Copy"),1500);};
    const sel=()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);};
    try{navigator.clipboard.writeText(el.textContent).then(done).catch(sel);}catch(err){sel();}}
});
document.getElementById("langBtn").onclick=()=>{lang=lang==="en"?"zh":"en";store.set("hefc-lang",lang);render();};
document.getElementById("menuBtn").onclick=e=>{const nav=document.getElementById("nav");const o=nav.classList.toggle("open");e.currentTarget.setAttribute("aria-expanded",o);};
render();

function labelTables(){

function pageMeta(){

(function(){const orig=render;render=function(){const r=orig.apply(this,arguments);try{labelTables();}catch(e){}try{pageMeta();}catch(e){}return r;};})();
